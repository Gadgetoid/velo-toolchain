<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Velo CE Primer preview</title>
<link rel="stylesheet" href="../style.css">
<style>
html {
    background: none;
}

body {
    position: relative;
    width: 1200px;
    height: 630px;
    max-width: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 96% 8%, var(--yellow) 0 70px, transparent 72px),
        radial-gradient(circle at 2% 100%, var(--magenta) 0 90px, transparent 92px),
        repeating-linear-gradient(-45deg, transparent 0 18px, rgb(0 165 168 / 0.16) 18px 23px),
        var(--paper);

    & > header {
        all: unset;
        position: absolute;
        top: 70px;
        left: 64px;
        width: 560px;

        & p {
            margin: 0 0 18px;
            font: 700 22px/1 var(--heading);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        & h1 {
            margin: 0;
            font: 700 84px/0.95 var(--heading);
            text-transform: uppercase;
            text-shadow: 5px 5px 0 var(--teal), 10px 10px 0 var(--magenta);
        }

        & h1 + p {
            margin-top: 34px;
            color: var(--purple);
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: 0.04em;
        }
    }

    & figure {
        position: absolute;
        margin: 0;

        & img {
            display: block;
            width: 470px;
            height: auto;
            border: 4px solid var(--ink);
            box-shadow: 10px 10px 0 var(--ink);
        }

        &:first-of-type {
            top: 60px;
            right: 50px;
            transform: rotate(3deg);
        }

        &:last-of-type {
            top: 330px;
            right: 90px;
            transform: rotate(-4deg);
        }
    }

    & svg {
        position: absolute;
    }

    & mark {
        position: absolute;
        left: 420px;
        bottom: 26px;
        display: grid;
        place-items: center;
        width: 180px;
        aspect-ratio: 1;
        padding: 40px;
        background: var(--yellow);
        clip-path: polygon(50% 0, 61% 18%, 82% 10%, 80% 32%, 100% 40%, 85% 56%, 96% 76%, 74% 78%, 68% 100%, 50% 86%, 32% 100%, 26% 78%, 4% 76%, 15% 56%, 0 40%, 20% 32%, 18% 10%, 39% 18%);
        color: var(--ink);
        font: 700 19px/1.1 var(--heading);
        text-align: center;
        text-transform: uppercase;
        transform: rotate(-10deg);
    }
}
</style>
</head>
<body>
<header>
<p>velo-toolchain Press</p>
<h1>The Velo CE Primer</h1>
<p>Programming Windows CE 1.0 and 2.0 on the Philips Velo 1</p>
</header>
<svg width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
<path d="M64 560 q14 -18 28 0 t28 0 t28 0 t28 0 t28 0" fill="none" stroke="#6c4ee0" stroke-width="7" stroke-linecap="round"/>
<path d="M580 40 l26 -26 l26 26 z" fill="#ff3d8b" stroke="#17142b" stroke-width="4"/>
<g fill="#17142b"><circle cx="1130" cy="560" r="5"/><circle cx="1150" cy="560" r="5"/><circle cx="1170" cy="560" r="5"/><circle cx="1130" cy="580" r="5"/><circle cx="1150" cy="580" r="5"/><circle cx="1170" cy="580" r="5"/></g>
</svg>
<figure><img src="../screenshots/ce2/appstore.png" alt=""></figure>
<figure><img src="../screenshots/ce1/frame.png" alt=""></figure>
<mark>With example programs</mark>
</body>
</html>
